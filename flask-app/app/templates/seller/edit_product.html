{% extends 'base.html' %}
{% block title %}Редактировать товар{% endblock %}
{% block content %}

<div class="d-flex align-items-center gap-3 mb-4">
    <a href="{{ url_for('seller.products') }}" class="btn btn-outline-secondary btn-sm">
        <i class="bi bi-arrow-left"></i>
    </a>
    <h2 class="h4 fw-bold mb-0">Редактировать товар</h2>
</div>

<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="bg-white rounded-3 p-4 shadow-sm">
            <form method="post">
                <div class="mb-3">
                    <label class="form-label fw-semibold">Название <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" name="name" required value="{{ product.name }}">
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Описание</label>
                    <textarea class="form-control" name="description" rows="4">{{ product.description or '' }}</textarea>
                </div>
                <div class="row g-3 mb-3">
                    <div class="col-md-4">
                        <label class="form-label fw-semibold">Цена (₽) <span class="text-danger">*</span></label>
                        <input type="number" class="form-control" name="price" required
                               min="1" step="0.01" value="{{ product.price }}">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-semibold">Старая цена (₽)</label>
                        <input type="number" class="form-control" name="old_price"
                               min="1" step="0.01" value="{{ product.old_price or '' }}">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-semibold">Остаток (шт.)</label>
                        <input type="number" class="form-control" name="stock" value="{{ product.stock }}" min="0">
                    </div>
                </div>
                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Категория <span class="text-danger">*</span></label>
                        <select class="form-select" name="category_id" required>
                            {% for cat in categories %}
                            <option value="{{ cat.id }}" {% if cat.id==product.category_id %}selected{% endif %}>
                                {% if cat.parent %}— {% endif %}{{ cat.name }}
                            </option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Бренд</label>
                        <input type="text" class="form-control" name="brand" value="{{ product.brand or '' }}">
                    </div>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-semibold">URL изображения</label>
                    <input type="url" class="form-control" name="image_url" value="{{ product.image_url or '' }}"
                           placeholder="https://example.com/image.jpg">
                    {% if product.image_url %}
                    <div class="mt-2">
                        <img src="{{ product.image_url }}" style="height:80px;object-fit:cover;border-radius:6px;">
                    </div>
                    {% endif %}
                </div>
                <div class="bg-warning-subtle rounded p-3 mb-4">
                    <i class="bi bi-info-circle me-2"></i>
                    После изменения товар будет повторно отправлен на <strong>модерацию</strong>.
                </div>
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-wb px-4">Сохранить изменения</button>
                    <a href="{{ url_for('seller.products') }}" class="btn btn-outline-secondary">Отмена</a>
                </div>
            </form>
        </div>
    </div>
</div>

{% endblock %}
