{% extends 'base.html' %}
{% block title %}Регистрация{% endblock %}
{% block content %}

<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="bg-white rounded-4 p-4 shadow-sm mt-3">
            <div class="text-center mb-4">
                <div class="fs-1 mb-2">🛍</div>
                <h2 class="h4 fw-bold">Создать аккаунт</h2>
                <p class="text-muted small">Присоединитесь к WildMarket</p>
            </div>
            <form method="post">
                <div class="mb-3">
                    <label class="form-label fw-semibold">Имя пользователя <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" name="username" required autofocus
                           placeholder="Ваше имя">
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Email <span class="text-danger">*</span></label>
                    <input type="email" class="form-control" name="email" required placeholder="example@mail.ru">
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Телефон</label>
                    <input type="tel" class="form-control" name="phone" placeholder="+7 (999) 999-99-99">
                </div>
                <div class="row g-2 mb-3">
                    <div class="col-6">
                        <label class="form-label fw-semibold">Пароль <span class="text-danger">*</span></label>
                        <input type="password" class="form-control" name="password" required placeholder="••••••••" minlength="6">
                    </div>
                    <div class="col-6">
                        <label class="form-label fw-semibold">Повторить <span class="text-danger">*</span></label>
                        <input type="password" class="form-control" name="confirm_password" required placeholder="••••••••">
                    </div>
                </div>
                <button type="submit" class="btn btn-wb w-100 btn-lg fw-bold">Зарегистрироваться</button>
            </form>
            <hr class="my-3">
            <p class="text-center mb-0">Уже есть аккаунт?
                <a href="{{ url_for('auth.login') }}" class="text-wb fw-semibold">Войти</a>
            </p>
        </div>
    </div>
</div>

{% endblock %}
