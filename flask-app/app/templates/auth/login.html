{% extends 'base.html' %}
{% block title %}Вход{% endblock %}
{% block content %}

<div class="row justify-content-center">
    <div class="col-md-5 col-lg-4">
        <div class="bg-white rounded-4 p-4 shadow-sm mt-3">
            <div class="text-center mb-4">
                <div class="fs-1 mb-2">🛍</div>
                <h2 class="h4 fw-bold">Войти в WildMarket</h2>
                <p class="text-muted small">Введите email и пароль</p>
            </div>

            {% if google_oauth_enabled %}
            <a href="{{ url_for('auth.google_login', next=request.args.get('next', '')) }}"
               class="btn btn-outline-secondary w-100 d-flex align-items-center justify-content-center gap-2 mb-3 py-2">
                <svg width="18" height="18" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
                    <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                    <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
                    <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
                    <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.31-8.16 2.31-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
                </svg>
                <span class="fw-semibold">Войти через Google</span>
            </a>
            <div class="d-flex align-items-center gap-2 mb-3">
                <hr class="flex-grow-1 m-0"><span class="text-muted small">или</span><hr class="flex-grow-1 m-0">
            </div>
            {% endif %}

            <form method="post">
                {% include '_csrf_field.html' %}
                <div class="mb-3">
                    <label class="form-label fw-semibold">Email</label>
                    <input type="email" class="form-control" name="email" required autofocus
                           placeholder="example@mail.ru">
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Пароль</label>
                    <input type="password" class="form-control" name="password" required placeholder="••••••••">
                </div>
                <div class="form-check mb-3">
                    <input class="form-check-input" type="checkbox" id="remember" name="remember">
                    <label class="form-check-label" for="remember">Запомнить меня</label>
                </div>
                <button type="submit" class="btn btn-wb w-100 btn-lg fw-bold">Войти</button>
            </form>
            <hr class="my-3">
            <p class="text-center mb-0">Нет аккаунта?
                <a href="{{ url_for('auth.register') }}" class="text-wb fw-semibold">Зарегистрироваться</a>
            </p>
        </div>
    </div>
</div>

{% endblock %}
