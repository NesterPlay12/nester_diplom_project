{% extends 'base.html' %}
{% block title %}Вход{% endblock %}
{% block content %}

<div class="row justify-content-center">
    <div class="col-md-5 col-lg-4">
        <div class="bg-white rounded-4 p-4 shadow-sm mt-3">
            <div class="text-center mb-4">
                <div class="fs-1 mb-2">🛍</div>
                <h2 class="h4 fw-bold">Войти в WildMarket</h2>
                <p class="text-muted small">Введите email и пароль</p>
            </div>
            <form method="post">
                <div class="mb-3">
                    <label class="form-label fw-semibold">Email</label>
                    <input type="email" class="form-control" name="email" required autofocus
                           placeholder="example@mail.ru">
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Пароль</label>
                    <input type="password" class="form-control" name="password" required placeholder="••••••••">
                </div>
                <div class="form-check mb-3">
                    <input class="form-check-input" type="checkbox" id="remember" name="remember">
                    <label class="form-check-label" for="remember">Запомнить меня</label>
                </div>
                <button type="submit" class="btn btn-wb w-100 btn-lg fw-bold">Войти</button>
            </form>
            <hr class="my-3">
            <p class="text-center mb-0">Нет аккаунта?
                <a href="{{ url_for('auth.register') }}" class="text-wb fw-semibold">Зарегистрироваться</a>
            </p>
        </div>
    </div>
</div>

{% endblock %}
